name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Redact IPs, domains, tokens and uuids** before pasting any output.
        Security problems: please use *Security → Report a vulnerability* instead of an issue.
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin / skill
      options: [coolify-ops / deploy-app, coolify-ops / provision-server, other]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked Claude (or the script command you ran), what you expected and what happened.
    validations: { required: true }
  - type: textarea
    id: output
    attributes:
      label: Script output (redacted)
      render: json
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "plugin 0.2.0 · Coolify v4.6.0 · Claude Code 2.x"
    validations: { required: true }
  - type: input
    id: server
    attributes:
      label: Server
      placeholder: "Ubuntu 24.04 x86_64 VPS / Raspberry Pi 5 Debian 12 at home"
