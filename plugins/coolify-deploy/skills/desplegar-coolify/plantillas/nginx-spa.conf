server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: las rutas que no son ficheros reales devuelven index.html (p. ej. /cart al recargar)
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Ficheros con hash en el nombre: caché larga
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # index.html sin caché, para que los despliegues nuevos se vean al momento
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
