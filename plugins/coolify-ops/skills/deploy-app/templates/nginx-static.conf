server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    # Static site generators (Astro, Next.js export, Nuxt generate) write a 404 page; nginx's own is used if absent
    error_page 404 /404.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
