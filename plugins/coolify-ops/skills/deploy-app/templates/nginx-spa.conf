server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative redirects (e.g. /about → /about/): keep the scheme and host the browser used behind the proxy
    absolute_redirect off;

    # SPA: routes that are not real files return the app shell (e.g. reloading /cart)
    location / {
        try_files $uri $uri/ /{{SPA_FALLBACK}};
    }
    # Hashed asset files: long cache
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # HTML pages (the shell included) are not cached, so new deployments show up immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
